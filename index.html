<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <title>Sirat-ul-Mustaqeem AI</title>
    <style>
        body { background-color: #002b1c; color: #d4af37; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background-color: #004225; padding: 25px; border-radius: 15px; border: 2px solid #d4af37; width: 90%; max-width: 550px; }
        .ayat { color: #f1e5ac; font-size: 22px; text-align: center; margin: 15px 0; font-weight: bold; }
        #chat-box { height: 350px; overflow-y: auto; border: 1px solid #d4af37; background: #00331a; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .msg { margin: 10px 0; padding: 10px; border-radius: 8px; line-height: 1.5; }
        .user { background: #005c33; color: white; text-align: right; margin-left: 20%; }
        .bot { background: #d4af37; color: #002b1c; font-weight: bold; margin-right: 20%; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 5px; border: 1px solid #d4af37; background: #f1e5ac; color: #002b1c; }
        button { padding: 12px 20px; background: #d4af37; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; color: #002b1c; }
    </style>
</head>
<body>
    <h1>صراطِ مستقیہم AI</h1>
    <div class="ayat">فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ</div>
    
    <div class="container">
        <div id="chat-box"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Sawal likhein...">
            <button onclick="send()">Bismillah</button>
        </div>
    </div>

    <script>
        // Yahan apni Hugging Face Space ka "Direct URL" dalein
        const SPACE_URL = "https://paradoxstudio9807-muslim-ai.hf.space/ask";

        async function send() {
            const input = document.getElementById('userInput');
            const box = document.getElementById('chat-box');
            if(!input.value.trim()) return;

            const val = input.value;
            box.innerHTML += `<div class="msg user">${val}</div>`;
            input.value = "";
            box.scrollTop = box.scrollHeight;

            try {
                const res = await fetch(SPACE_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: val})
                });
                const data = await res.json();
                const reply = data[0].generated_text.split("<|assistant|>\n")[1] || "Maafi chahta hoon, dobara koshish karein.";
                box.innerHTML += `<div class="msg bot">${reply}</div>`;
            } catch (error) {
                box.innerHTML += `<div class="msg bot" style="color:red;">Connection Error! Check if Space is running.</div>`;
            }
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
