<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirat-ul-Mustaqeem AI | صراطِ مستقیہم</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #004d40;
            --secondary-green: #002b1c;
            --gold: #d4af37;
            --light-gold: #f1e5ac;
            --white: #ffffff;
        }

        body {
            background: radial-gradient(circle, var(--secondary-green) 0%, #001a11 100%);
            color: var(--gold);
            font-family: 'Amiri', serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-card {
            background: rgba(0, 77, 64, 0.9);
            width: 100%;
            max-width: 500px;
            height: 90vh;
            border-radius: 20px;
            border: 2px solid var(--gold);
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            overflow: hidden;
            margin: 10px;
        }

        .header {
            background: var(--secondary-green);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--gold);
        }

        .header h1 { margin: 0; font-size: 28px; color: var(--gold); }
        .ayat-header { font-size: 18px; color: var(--light-gold); margin-top: 5px; }

        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-image: url('https://www.transparenttextures.com/patterns/islamic-art.png');
        }

        .msg {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 15px;
            font-size: 18px;
            line-height: 1.6;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user {
            align-self: flex-start;
            background: var(--gold);
            color: var(--secondary-green);
            border-bottom-left-radius: 2px;
            font-weight: bold;
        }

        .bot {
            align-self: flex-end;
            background: var(--secondary-green);
            color: var(--light-gold);
            border: 1px solid var(--gold);
            border-bottom-right-radius: 2px;
            text-align: right;
        }

        .loading-dots:after {
            content: ' .';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots { 0%, 20% { color: rgba(0,0,0,0); text-shadow: .2em 0 0 rgba(0,0,0,0), .4em 0 0 rgba(0,0,0,0); } 40% { color: var(--gold); text-shadow: .2em 0 0 rgba(0,0,0,0), .4em 0 0 rgba(0,0,0,0); } 60% { text-shadow: .2em 0 0 var(--gold), .4em 0 0 rgba(0,0,0,0); } 80%, 100% { text-shadow: .2em 0 0 var(--gold), .4em 0 0 var(--gold); } }

        .input-area {
            padding: 20px;
            background: var(--secondary-green);
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            background: #003d33;
            border: 1px solid var(--gold);
            border-radius: 10px;
            padding: 12px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        button {
            background: var(--gold);
            color: var(--secondary-green);
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background: var(--light-gold); transform: scale(1.05); }

    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>صراطِ مستقیہم AI</h1>
        <div class="ayat-header">فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ</div>
    </div>

    <div id="chat-box">
        <div class="msg bot">Assalamu Alaikum! Main Sirat-ul-Mustaqeem AI hoon. Main Deen-e-Islam ki maloomat mein aapki madad kar sakta hoon. Sawal poochiye?</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Sawal likhein..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">Bismillah</button>
    </div>
</div>

<script>
    const SPACE_URL = "https://paradoxstudio9807-muslim-ai.hf.space/ask";

    async function send() {
        const input = document.getElementById('userInput');
        const box = document.getElementById('chat-box');
        const text = input.value.trim();
        
        if(!text) return;

        // User message UI
        box.innerHTML += `<div class="msg user">${text}</div>`;
        input.value = "";
        
        // AI Response Placeholder (Starting state)
        const loadingId = "load-" + Date.now();
        box.innerHTML += `<div class="msg bot" id="${loadingId}">Responcing<span class="loading-dots"></span></div>`;
        const botMsgDiv = document.getElementById(loadingId);
        box.scrollTop = box.scrollHeight;

        try {
            const response = await fetch(SPACE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });

            // Agar model load ho raha ho (503)
            if (response.status === 503) {
                botMsgDiv.innerText = "Sirat-ul-Mustaqeem AI jaag raha hai... Bas thodi dair sabar karein.";
                return;
            }

            // STREAMING LOGIC START
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullText = "";
            let firstChunk = true;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                // Chunk ko decode karna
                const chunk = decoder.decode(value, { stream: true });
                
                // Pehle chunk par animation hatana
                if (firstChunk) {
                    botMsgDiv.innerText = ""; 
                    firstChunk = false;
                }

                // Hugging Face JSON response ko clean karna
                try {
                    // Yahan hum data ko sanitize kar rahe hain
                    const cleanData = chunk.replace(/data: /g, '').trim();
                    const parsed = JSON.parse(cleanData);
                    
                    // Text extract karna (Model to model depend karta hai)
                    let newText = "";
                    if (Array.isArray(parsed)) {
                        newText = parsed[0].generated_text || "";
                    } else {
                        newText = parsed.generated_text || "";
                    }

                    // Cleaning Prompt tags
                    if (newText.includes("<|assistant|>")) {
                        newText = newText.split("<|assistant|>").pop();
                    }
                    
                    fullText = newText.trim();
                    botMsgDiv.innerText = fullText;

                } catch (e) {
                    // Agar chunk incomplete JSON ho toh skip karein jab tak complete na ho jaye
                }
                
                box.scrollTop = box.scrollHeight;
            }

        } catch (error) {
            console.error(error);
            botMsgDiv.innerHTML = `<span style="color:#ff5252;">Rabta nahi ho saka. Connection check karein.</span>`;
        }
    }
</script>

</body>
</html>
